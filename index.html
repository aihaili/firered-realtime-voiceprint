<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
<title>FireRed 实时语音转写</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #ededed;
    display: flex; justify-content: center;
    height: 100vh; overflow: hidden;
  }
  .app {
    width: 100%; max-width: 480px; height: 100vh;
    display: flex; flex-direction: column;
    background: #f5f5f5; box-shadow: 0 0 20px rgba(0,0,0,.15);
  }
  .header {
    background: #ededed; border-bottom: 1px solid #ddd;
    padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 17px; color: #333; font-weight: 600; flex: 1; }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #c0c0c0; flex-shrink: 0; }
  .status-dot.on { background: #07c160; box-shadow: 0 0 6px #07c16088; }
  .status-dot.rec { background: #fa5151; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .status-text { font-size: 12px; color: #888; white-space: nowrap; }
  .chat {
    flex: 1; overflow-y: auto; padding: 16px 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .hint { color: #b0b0b0; font-size: 13px; text-align: center; margin-top: 40px; line-height: 1.8; }
  /* 实时字幕区：录音中显示当前句，持续刷新 */
  .live-caption {
    align-self: flex-end; max-width: 88%;
    background: #95ec69; color: #000;
    padding: 10px 14px; border-radius: 8px;
    font-size: 16px; line-height: 1.6; word-break: break-word;
    min-height: 24px;
    animation: pop .15s ease-out;
  }
  .live-caption::after { content: "▍"; animation: blink .8s infinite; color: #3a6b2a; }
  @keyframes blink { 50% { opacity: .1; } }
  /* 定格气泡 */
  .bubble {
    align-self: flex-end; max-width: 82%;
    background: #95ec69; color: #000;
    padding: 9px 12px; border-radius: 8px;
    font-size: 15px; line-height: 1.5; word-break: break-word;
    animation: pop .15s ease-out;
  }
  .bubble .time {
    display: block; font-size: 10px; color: #5a8f3e;
    margin-top: 4px; text-align: right;
  }
  .bubble .spk {
    display: block; font-size: 11px; font-weight: 600;
    margin-bottom: 3px; color: #333;
  }
  /* 声纹库管理 */
  .spk-btn {
    border: none; background: #e5e5e5; color: #333; font-size: 13px;
    padding: 4px 10px; border-radius: 14px; cursor: pointer; white-space: nowrap;
  }
  .spk-btn .cnt { background: #07c160; color: #fff; border-radius: 8px; padding: 0 5px; font-size: 11px; margin-left: 3px; }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: none; align-items: flex-end; justify-content: center; z-index: 99;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; width: 100%; max-width: 480px; max-height: 70vh;
    border-radius: 14px 14px 0 0; display: flex; flex-direction: column;
  }
  .modal h3 { padding: 14px 16px; font-size: 16px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
  .modal h3 .close { margin-left: auto; border: none; background: none; font-size: 20px; color: #999; cursor: pointer; }
  .spk-list { overflow-y: auto; padding: 8px 16px; }
  .spk-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid #f2f2f2; }
  .spk-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .spk-row input {
    flex: 1; border: 1px solid #ddd; border-radius: 6px; padding: 6px 8px;
    font-size: 14px; min-width: 0;
  }
  .spk-row .cnt2 { font-size: 11px; color: #999; white-space: nowrap; }
  .modal .actions { padding: 10px 16px; border-top: 1px solid #eee; display: flex; gap: 10px; justify-content: flex-end; }
  .modal .actions button { border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .btn-save { background: #07c160; color: #fff; }
  .btn-reset { background: #f2f2f2; color: #666; }
  .spk-empty { color: #aaa; font-size: 13px; text-align: center; padding: 24px 0; }
  @keyframes pop { from { transform: scale(.97); opacity: .4; } }
  .footer {
    flex-shrink: 0; border-top: 1px solid #ddd; background: #f7f7f7;
    padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  #btn {
    width: 72px; height: 72px; border-radius: 50%; border: none;
    background: #07c160; color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all .2s; display: flex;
    align-items: center; justify-content: center; flex-direction: column; gap: 2px;
    user-select: none;
  }
  #btn .icon { font-size: 22px; line-height: 1; }
  #btn.recording { background: #fa5151; animation: ring 1.2s infinite; }
  @keyframes ring {
    0% { box-shadow: 0 0 0 0 rgba(250,81,81,.5); }
    100% { box-shadow: 0 0 0 16px rgba(250,81,81,0); }
  }
  #btn:disabled { background: #c8c8c8; cursor: not-allowed; animation: none; }
  .tip { font-size: 11px; color: #aaa; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="status-dot" id="dot"></div>
    <h1>FireRed 实时转写</h1>
    <button class="spk-btn" id="spk-btn" title="声纹库 / 说话人命名">👥 声纹 <span class="cnt" id="spk-cnt">0</span></button>
    <span class="status-text" id="status">连接中…</span>
  </div>
  <div class="chat" id="chat">
    <div class="hint" id="hint">点击下方的绿色按钮开始录音<br>如没声音，请在上方切换麦克风设备<br>语音将实时转成文字显示在这里</div>
  </div>
  <div class="footer">
    <select id="mic-select" style="width:100%;max-width:320px;padding:6px 8px;border-radius:6px;border:1px solid #ccc;font-size:13px;background:#fff;color:#333">
      <option value="">默认麦克风</option>
    </select>
    <button id="btn" disabled><span class="icon">🎤</span><span id="btn-label">开始</span></button>
    <div id="meter-wrap" style="width:180px;height:6px;background:#ddd;border-radius:3px;overflow:hidden;display:none">
      <div id="meter" style="height:100%;width:0%;background:#07c160;transition:width .15s"></div>
    </div>
    <div class="tip" id="tip">等待服务器就绪…</div>
    <div class="tip" id="rx-tip" style="color:#07c160;font-weight:600"></div>
  </div>
</div>

<!-- 声纹库管理弹窗 -->
<div class="modal-mask" id="spk-mask">
  <div class="modal">
    <h3>声纹库（给说话人命名）<button class="close" id="spk-close">✕</button></h3>
    <div class="spk-list" id="spk-list"></div>
    <div class="actions">
      <button class="btn-reset" id="spk-reset">清空声纹库</button>
      <button class="btn-save" id="spk-save">保存名字</button>
    </div>
  </div>
</div>

<script>
const dot = document.getElementById('dot');
const statusEl = document.getElementById('status');
const chat = document.getElementById('chat');
const hint = document.getElementById('hint');
const btn = document.getElementById('btn');
const btnLabel = document.getElementById('btn-label');
const tip = document.getElementById('tip');
const rxTip = document.getElementById('rx-tip');
const meterWrap = document.getElementById('meter-wrap');
const meter = document.getElementById('meter');
const micSelect = document.getElementById('mic-select');

let ws, audioCtx, stream, workletNode, srcNode;
let recording = false;
let liveEl = null;   // 当前实时字幕元素
let liveText = '';
let speakerMap = {}; // spkId -> {id,name,color,count}

async function enumerateMics() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const mics = devices.filter(d => d.kind === 'audioinput');
    if (!mics.length) return;
    micSelect.innerHTML = '';
    for (const m of mics) {
      const o = document.createElement('option');
      o.value = m.deviceId;
      o.textContent = m.label || ('麦克风 ' + (mics.indexOf(m) + 1));
      micSelect.appendChild(o);
    }
    micSelect.selectedIndex = 0;
  } catch (e) { /* 未授权时拿不到标签，忽略 */ }
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  dot.className = 'status-dot' + (cls ? ' ' + cls : '');
}

function showLive() {
  if (liveEl) return;
  liveEl = document.createElement('div');
  liveEl.className = 'live-caption';
  liveText = '';
  liveEl.textContent = '';
  chat.appendChild(liveEl);
  chat.scrollTop = chat.scrollHeight;
}

function updateLive(text) {
  if (!liveEl) showLive();
  liveText = text;
  liveEl.textContent = text;
  chat.scrollTop = chat.scrollHeight;
}

function addBubble(text, spkId) {
  const b = document.createElement('div');
  b.className = 'bubble';
  if (spkId) {
    // speakerMap 可能还没刷新到（新说话人刚建立）→ 兜底显示，避免整段无标识
    const sp = speakerMap[spkId] || { id: spkId, name: '', color: '#607d8b' };
    const tag = document.createElement('span');
    tag.className = 'spk';
    tag.textContent = '● ' + (sp.name || '说话人 ' + spkId.replace('spk_', ''));
    tag.style.color = sp.color || '#607d8b';
    b.appendChild(tag);
    if (!speakerMap[spkId]) loadSpeakers();
  }
  const txt = document.createElement('span');
  txt.textContent = text;
  b.appendChild(txt);
  const t = document.createElement('span');
  t.className = 'time';
  t.textContent = new Date().toLocaleTimeString('zh-CN', {hour12: false});
  b.appendChild(t);
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
}

function clearLive() {
  if (liveEl) {
    liveEl.remove();
    liveEl = null;
    liveText = '';
  }
}

// 服务端回溯纠正：新说话人确认后，把之前暂时继承错的气泡改标（仅 FireRed 版会发此消息）
function relabelBubble(text, spkId) {
  const bubbles = chat.querySelectorAll('.bubble');
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    const txtEl = b.querySelector('span:not(.spk):not(.time)');
    if (txtEl && txtEl.textContent === text) {
      const sp = speakerMap[spkId] || { id: spkId, name: '', color: '#607d8b' };
      let tag = b.querySelector('.spk');
      if (!tag) {
        tag = document.createElement('span');
        tag.className = 'spk';
        b.insertBefore(tag, b.firstChild);
      }
      tag.textContent = '● ' + (sp.name || '说话人 ' + spkId.replace('spk_', ''));
      tag.style.color = sp.color || '#607d8b';
      if (!speakerMap[spkId]) loadSpeakers();
      return true;
    }
  }
  return false;
}

// 定版：服务端离线全局聚类后回发的改正结果
function applyRevision(bubbles, full) {
  if (!bubbles || !bubbles.length) return 0;
  if (full) {
    // 整份替换：定版可能把一句话按说话人拆成多个气泡，按序重建最稳妥
    chat.querySelectorAll('.bubble').forEach(el => el.remove());
    for (const b of bubbles) addBubble(b.text, b.spk);
    loadSpeakers();
    return bubbles.length;
  }
  const els = chat.querySelectorAll('.bubble');
  let n = 0, k = 0;
  for (const b of bubbles) {
    let target = null;
    for (let i = k; i < els.length; i++) {
      const txtEl = els[i].querySelector('span:not(.spk):not(.time)');
      if (txtEl && txtEl.textContent === b.text) { target = els[i]; k = i + 1; break; }
    }
    if (!target || !b.spk) continue;
    const sp = speakerMap[b.spk] || { id: b.spk, name: '', color: '#607d8b' };
    let tag = target.querySelector('.spk');
    if (!tag) {
      tag = document.createElement('span');
      tag.className = 'spk';
      target.insertBefore(tag, target.firstChild);
    }
    tag.textContent = '● ' + (sp.name || '说话人 ' + b.spk.replace('spk_', ''));
    tag.style.color = sp.color || '#607d8b';
    n++;
  }
  if (n) loadSpeakers();
  return n;
}

async function startRecording() {
  const constraints = {
    audio: {
      channelCount: 1,
      echoCancellation: true,
      noiseSuppression: false,
      autoGainControl: true
    }
  };
  const micId = micSelect.value;
  if (micId) constraints.audio.deviceId = { exact: micId };
  stream = await navigator.mediaDevices.getUserMedia(constraints);
  audioCtx = new AudioContext();
  // 在用户手势中打开，通常已 running；保险起见 resume
  if (audioCtx.state !== 'running') await audioCtx.resume();
  srcNode = audioCtx.createMediaStreamSource(stream);
  await audioCtx.audioWorklet.addModule('/audio-worklet.js?t=' + Date.now());
  workletNode = new AudioWorkletNode(audioCtx, 'mic-capture', {
    processorOptions: { sampleRate: audioCtx.sampleRate }
  });
  workletNode.port.onmessage = (e) => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(e.data);
  };
  srcNode.connect(workletNode);
  // 连到零增益节点驱动 process()，避免麦克风声音从扬声器回放
  const silent = audioCtx.createGain();
  silent.gain.value = 0;
  silent.connect(audioCtx.destination);
  workletNode.connect(silent);
  ws.send(JSON.stringify({cmd: 'start'}));
}

async function stopRecording() {
  try { ws.send(JSON.stringify({cmd: 'stop'})); } catch (e) {}
  if (workletNode) workletNode.disconnect();
  if (srcNode) srcNode.disconnect();
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  workletNode = null; srcNode = null; stream = null; audioCtx = null;
}

btn.addEventListener('click', async () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (!recording) {
    try {
      recording = true;
      btn.classList.add('recording');
      btnLabel.textContent = '停止';
      hint.style.display = 'none';
      tip.textContent = '正在录音，说话试试…（文字实时更新）';
      setStatus('录音中', 'rec');
      showLive();
      await startRecording();
      await enumerateMics(); // 授权后才能拿到设备标签
    } catch (err) {
      recording = false;
      btn.classList.remove('recording');
      btnLabel.textContent = '开始';
      setStatus('麦克风错误');
      tip.textContent = '无法访问麦克风: ' + err.message;
    }
  } else {
    recording = false;
    btn.classList.remove('recording');
    btnLabel.textContent = '开始';
    setStatus('已停止', 'on');
    tip.textContent = '点击按钮重新开始';
    await stopRecording();
    clearLive();
  }
});

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => setStatus('已连接', 'on');
  ws.onclose = () => {
    setStatus('连接断开');
    btn.disabled = true;
    tip.textContent = '连接断开，请刷新页面重试';
    if (recording) { recording = false; btn.classList.remove('recording'); btnLabel.textContent = '开始'; clearLive(); }
  };
  ws.onerror = () => setStatus('连接错误');
  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) return;
    const msg = JSON.parse(e.data);
    if (msg.type === 'status') {
      btn.disabled = !msg.model_ready;
      tip.textContent = msg.model_ready ? '就绪（模型 ' + msg.model + '），点击按钮开始录音' : '服务器模型加载中，请稍候…';
      if (msg.model_ready) setStatus('就绪', 'on');
    } else if (msg.type === 'live') {
      if (recording) updateLive(msg.text);
    } else if (msg.type === 'final') {
      addBubble(msg.text, msg.spk);
      clearLive();
      // 说话人可能新增（服务端已建），刷新声纹库
      if (msg.spk && !speakerMap[msg.spk]) loadSpeakers();
    } else if (msg.type === 'relabel') {
      relabelBubble(msg.text, msg.spk);
    } else if (msg.type === 'revision') {
      // 定版结果：整段会话离线 diarization + 重嵌入后的说话人改正
      const n = applyRevision(msg.bubbles, msg.full);
      rxTip.textContent = n ? ('已定版：' + n + ' 条已按声纹校正') : '';
      rxTip.style.color = '#1989fa';
      setTimeout(() => { if (rxTip.textContent.startsWith('已定版')) rxTip.textContent = ''; }, 6000);
    } else if (msg.type === 'stats') {
      if (recording) {
        rxTip.textContent = (msg.in_speech ? '● 正在听…' : '○ 等待说话');
        rxTip.style.color = msg.in_speech ? '#07c160' : '#888';
        meterWrap.style.display = 'block';
        const pct = Math.min(100, Math.round(msg.rms * 400));
        meter.style.width = pct + '%';
        meter.style.background = msg.rms < 0.01 ? '#fa5151' : (msg.rms < 0.05 ? '#ff9800' : '#07c160');
      } else {
        rxTip.textContent = '';
        meterWrap.style.display = 'none';
        meter.style.width = '0%';
      }
    } else if (msg.type === 'stopped') {
      clearLive();
    }
  };
}
// ---- 声纹库管理 ----
const spkBtn = document.getElementById('spk-btn');
const spkCnt = document.getElementById('spk-cnt');
const spkMask = document.getElementById('spk-mask');
const spkList = document.getElementById('spk-list');

async function loadSpeakers() {
  try {
    const r = await fetch('/speakers');
    const d = await r.json();
    speakerMap = {};
    for (const s of d.speakers) speakerMap[s.id] = s;
    spkCnt.textContent = d.speakers.length;
    renderSpkList();
  } catch (e) { /* ignore */ }
}

function renderSpkList() {
  const ids = Object.keys(speakerMap).sort();
  if (!ids.length) {
    spkList.innerHTML = '<div class="spk-empty">还没有说话人<br>开始录音后，这里会出现自动识别的声纹，可命名</div>';
    return;
  }
  spkList.innerHTML = '';
  for (const id of ids) {
    const s = speakerMap[id];
    const row = document.createElement('div');
    row.className = 'spk-row';
    const dot = document.createElement('span');
    dot.className = 'spk-dot';
    dot.style.background = s.color;
    const inp = document.createElement('input');
    inp.value = s.name || '';
    inp.placeholder = '说话人 ' + id.replace('spk_', '');
    inp.dataset.id = id;
    const cnt = document.createElement('span');
    cnt.className = 'cnt2';
    cnt.textContent = s.count + ' 句';
    row.appendChild(dot); row.appendChild(inp); row.appendChild(cnt);
    spkList.appendChild(row);
  }
}

function openSpk() { renderSpkList(); spkMask.classList.add('show'); }
function closeSpk() { spkMask.classList.remove('show'); }

spkBtn.addEventListener('click', openSpk);
document.getElementById('spk-close').addEventListener('click', closeSpk);
spkMask.addEventListener('click', (e) => { if (e.target === spkMask) closeSpk(); });

document.getElementById('spk-save').addEventListener('click', async () => {
  const inputs = spkList.querySelectorAll('input[data-id]');
  for (const inp of inputs) {
    const name = inp.value.trim().slice(0, 20);
    await fetch('/speakers/' + inp.dataset.id + '/name', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
  }
  await loadSpeakers();
  closeSpk();
});

document.getElementById('spk-reset').addEventListener('click', async () => {
  if (!confirm('确定清空声纹库？所有说话人名字和声纹都会删除。')) return;
  await fetch('/speakers/reset', { method: 'POST' });
  await loadSpeakers();
  closeSpk();
});

loadSpeakers();
setInterval(() => { if (spkMask.classList.contains('show')) renderSpkList(); }, 3000);

connect();
</script>
</body>
</html>
